upstream django {
    server app:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://django;
    }

    location /static/ {
        # Update to correctly point to static files
        alias /app/static/;  # Point to the correct static directory inside the container
    }

    location /media/ {
        # Update to correctly point to media files
        alias /app/media/;  # Point to the correct media directory inside the container
    }
}

